<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Body -->
  <rect x="6" y="8" width="52" height="36" rx="6" ry="6" fill="#9b8fc7"/>
  <!-- Bottom rounded grip -->
  <rect x="6" y="36" width="52" height="12" fill="#9b8fc7"/>
  <ellipse cx="16" cy="48" rx="10" ry="8" fill="#9b8fc7"/>
  <ellipse cx="48" cy="48" rx="10" ry="8" fill="#9b8fc7"/>
  <!-- Screen bezel -->
  <rect x="14" y="13" width="36" height="24" rx="3" ry="3" fill="#4a3f7a"/>
  <!-- Screen -->
  <rect x="16" y="15" width="32" height="20" rx="2" ry="2" fill="#8bac0f"/>
  <!-- D-pad horizontal -->
  <rect x="10" y="38" width="12" height="4" rx="1" fill="#4a3f7a"/>
  <!-- D-pad vertical -->
  <rect x="14" y="34" width="4" height="12" rx="1" fill="#4a3f7a"/>
  <!-- A button -->
  <circle cx="50" cy="38" r="4" fill="#e74c3c"/>
  <!-- B button -->
  <circle cx="41" cy="42" r="4" fill="#e6a817"/>
  <!-- Start/Select -->
  <rect x="27" y="41" width="6" height="3" rx="1.5" fill="#4a3f7a"/>
  <rect x="34" y="41" width="6" height="3" rx="1.5" fill="#4a3f7a"/>
</svg>
